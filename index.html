<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || desc.configurable) {
            var currentFetch = window.fetch;
            if (typeof currentFetch === 'function') {
              Object.defineProperty(window, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () { return currentFetch; },
                set: function (next) {
                  if (typeof next === 'function') currentFetch = next;
                }
              });
            }
          }
        } catch (e) {}

        window.addEventListener(
          'error',
          function (event) {
            var filename = event && event.filename ? event.filename : '';
            var stack = event && event.error && event.error.stack ? event.error.stack : '';
            var msg = event && event.message ? event.message : '';
            if (
              filename.indexOf('chrome-extension://') === 0 ||
              filename.indexOf('moz-extension://') === 0 ||
              stack.indexOf('chrome-extension://') !== -1 ||
              msg.indexOf('Cannot set property fetch of #<Window>') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
